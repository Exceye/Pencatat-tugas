<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#3157c8">
  <title>Tugas Sekolah</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="app">
    <header class="header">
      <p class="eyebrow">PENCATAT PRIBADI</p>
      <h1>Tugas Sekolah</h1>
      <p id="ringkasan" class="ringkasan" aria-live="polite">Memuat tugas…</p>
      <div class="progres" role="progressbar" aria-label="Progres tugas selesai"
           aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <span id="progres-isi"></span>
      </div>
    </header>

    <section class="panel" aria-labelledby="form-heading">
      <h2 id="form-heading">Tambah tugas</h2>
      <form id="form-tugas" class="form" autocomplete="off">
        <label class="field full" for="judul">
          <span>Nama tugas</span>
          <input id="judul" name="judul" type="text" maxlength="100"
                 placeholder="Contoh: Kerjakan soal bab 3" required>
        </label>
        <label class="field" for="mapel">
          <span>Mata pelajaran <small>(opsional)</small></span>
          <input id="mapel" name="mapel" type="text" maxlength="40"
                 placeholder="Matematika">
        </label>
        <label class="field" for="tenggat">
          <span>Tenggat <small>(opsional)</small></span>
          <input id="tenggat" name="tenggat" type="date">
        </label>
        <button type="submit" class="tambah">+ Tambah tugas</button>
      </form>
    </section>

    <section class="panel" aria-labelledby="list-heading">
      <div class="list-header">
        <h2 id="list-heading">Daftar tugas</h2>
        <button id="hapus-selesai" class="button button-quiet" type="button">Hapus yang selesai</button>
      </div>
      <nav class="filter" aria-label="Filter tugas">
        <button type="button" data-filter="semua" class="aktif" aria-pressed="true">Semua</button>
        <button type="button" data-filter="belum" aria-pressed="false">Belum selesai</button>
        <button type="button" data-filter="selesai" aria-pressed="false">Selesai</button>
      </nav>
      <p id="kosong" class="empty">Belum ada tugas. Tambahkan tugas pertamamu di atas.</p>
      <ul id="daftar" class="daftar" aria-label="Daftar tugas"></ul>
      <p id="status" class="sr-only" aria-live="polite"></p>
    </section>

    <footer>Data disimpan di browser pada perangkat ini.</footer>
  </main>
</body>
</html>
